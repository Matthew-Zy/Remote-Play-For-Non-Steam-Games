[package]
name = "Remote-Play-For-Non-Steam-Games"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "remote-play"
path = "src/main.rs"

[dependencies]
crossterm = "0.29.0"
ratatui = "0.30.2"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

[build-dependencies]
winres = "0.1"


[package.metadata.packager]
name = "remote-play"
product_name = "Remote Play For Non Steam Games"
version = "0.1.0"
identifier = ""
icons = ["assets/icon.png"]
authors = ["Matthew-Zy"]
description = "Application to help use remote play with non steam games"

[package.metadata.packager.appimage]
