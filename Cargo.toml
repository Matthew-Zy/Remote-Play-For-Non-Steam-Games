[package]
name = "Remote-Play-For-Non-Steam-Games"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "remote-play"
path = "src/main.rs"

[dependencies]
crossterm = "0.29.0"
ratatui = "0.30.2"
serde = { version = "1.0", features = ["derive"] }
slint = "1.17.1"
toml = "0.8"

[build-dependencies]
winres = "0.1"
slint-build = "1.17.1"

